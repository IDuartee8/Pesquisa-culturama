<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <title>Pesquisa Culturama</title>
</head>
<body>
    <header>
        <h1>Pesquisa Online</h1>
    </header>
    <section>
        <form action="" method="get">   
          <fieldset>
   
            <legend>Dados Pessoais</legend>
            
                <label for="name">Nome:
                </label>
                    <input id="name" type="text" name="userName" required>
                    <br>
                <label for="age">Idade
                </label>
                    <input id="age" type="number" name="userAge" min="12" max="100" required>
                
                <label for="birthDate">Data de nascimento
                </label>
                    <input id="birthDate" type="date" name="userBirthDate">
                    <br>

                <label for="email">Email</label> 
                    <input id="email" type="email" name="userEmail" required>
                    <br>

                <label for="phoneNumber">Telefone</label>
                    <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD+ número sem espaço ou hífen">
                    <br>

                <label for="image">Upload de foto</label>
                    <input id="image" type="file" accept="iamge/*" name="userImage">
                    <br>
        </fieldset>
            <fieldset>
                <legend>Perfil</legend>
                    <p>Coloque o seu gênero:</p>

                   <input id="fem" type="radio" name="userGender" value="Feminino">
                   <label for="fem">Feminino
                   </label>

                   <input id="masc" type="radio" name="userGender" value="Masculino">
                   <label for="masc">Masculino
                   </label>

                   <input id="notInformed" type="radio" name="userGender" value="notInformed">
                   <label for="notInformed">Prefiro não informar
                   </label> 
                    <br>

                   <label for="maritalStatus">Estado civil:
                   </label>
                    <select id="maritalStatus" name="userMaritalStatus">

                        <option value="notInformed">Selecione</option>
                        <option value="Casado">Casado </option>
                        <option value="Solteiro">Solteiro</option>
                        <option value="Divorciado">Divorciado</option>
                        <option value="UniaoEstavel">União estável </option>
            </select>
                    <br>
                        <label for="state">Estado:</label>
                <select id="state" name="userState" required>
                        <option value="acre">Acre
                    </option>
                        <option value="alagoas">Alagoas
                    </option>
                        <option value="amapa">Amapá
                    </option>
                        <option value="amazonas">Amazonas
                    </option>
                        <option value="bahia">Bahia
                    </option>
                        <option value="ceara">Ceará
                    </option>
                        <option value="distritoFederal">Distrito Federal
                    </option>
                        <option value="espiritoSanto">Espírito Santo
                    </option>
                        <option value="goias">Goiás
                    </option>
                        <option value="maranhao">Maranhão
                    </option>
                        <option value="matoGrosso">Mato Grosso
                    </option>
                        <option value="matoGrossoDoSul">Mato Grosso do Sul
                    </option>
                        <option value="minasGerais">Minas Gerais
                    </option>
                        <option value="para">Pará
                    </option>
                        <option value="paraiba">Paraíba
                    </option>
                        <option value="parana">Paraná
                    </option>
                        <option value="pernambuco">Pernambuco
                    </option>
                        <option value="piaui">Piauí
                    </option>
                        <option value="rioDeJaneiro">Rio de Janeiro
                    </option>
                        <option value="rioGrandeDoNorte">Rio Grande do Norte
                    </option>
                        <option value="rioGrandeDoSul">Rio Grande do Sul
                    </option>
                        <option value="rondonia">Rondônia
                    </option>
                        <option value="roraima">Roraima
                    </option>
                        <option value="santaCatarina">Santa Catarina
                    </option>
                        <option value="saoPaulo">São Paulo
                    </option>
                        <option value="sergipe">Sergipe
                    </option>
                        <option value="tocantins">Tocantins
                    </option>
                </select>
                    <br>
                        <label for="city">Cidade 
                    </label>
                        <input id="city" type="text" name="userCity">
            </fieldset> 
                <fieldset>
                    <legend>Hábitos</legend>
                        <p>Redes Sociais</p>
                        <input id="instagram" type="checkbox" name="social" value="instagram">
                        <Label for="instagram">Instagram</Label>
                        <br>
                        <input id="facebook" type="checkbox" name="social" value="facebook">
                        <Label for="facebook">Facebook</Label>
                        <br>
                        <input id="linkedin" type="checkbox" name="social" value="linkedin">
                        <Label for="linkedin">Linkedin</Label>
                        <br>
                        <input id="X" type="checkbox" name="social" value="x">
                        <Label for="X">X</Label>
                        <br>
                    <label for="musicStyle">Estilo musical:</label>
                    <input list="styleTypes" id="musicStyle" type=" text" name="userMusicStyle">
                    
                    <datalist id="styleTypes">
                        <option value="Rock"></option>
                        <option value="Pop"></option>
                        <option value="Samba"></option>
                        <option value="Sertanejo"></option>
                        <option value="Reggae"></option>
                        <option value="Gospel"></option>
                    </datalist>
                    <br>
                    
                    <label for="favoriteColor">Cor favorita</label>
                    <input type="color" name="userFavoriteColor" id="favoriteColor">

                </fieldset>
                <fieldset>
                        <legend>Opinião</legend>
                            <p>O que você achou da qualidade do nosso serviço?</p>

                            <input id="bad" type="radio" name="userAvaliation" value="ruim"><label for="bad">Ruim
                                <br>
                            <input id="regular" type="radio" name="userAvaliation" value="regular"><label for="regular">Regular
                                <br>
                            <input id="good" type="radio" name="userAvaliation" value="Ruim"><label for="bad">Boa
                                <br>
                            <input id="great" type="radio" name="userAvaliation" value="great"><label for="great">Ótima</label>
                                <br>
                                <br>
                            <label for="comment">Escreva o seu comentário:</label>
                            <textarea id="comment" name="userComment" placeholder="Digite aqui sua opinião..."></textarea>
                            <br>
                        <fieldset>
                                <legend>Confirmações</legend>

                                    <input type="checkbox" name="userLgpd" id="userLgpdTerm" value="accepted" required>
                                    <label for="userLgpdTerm">Eu aceito perticipar da pesquisa</label>
                                    <br>
                                    <input type="checkbox" name="userGetResult" id="GetResult" value="accepted" required>
                                    <label for="userGetResult">Desejo receber o resultado pelo email.</label>
                                    <br>
                            </fieldset>
                    </fieldset>
                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>
        </form>
    </section>
</body>
</html>
